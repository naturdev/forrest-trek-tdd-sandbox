<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe: Rabbit vs Turtle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Tic-Tac-Toe</h1>
    <div class="players">
      <div class="player" id="player-rabbit">
        <span class="icon">🐰</span>
        <span class="label">Rabbit</span>
      </div>
      <div class="vs">vs</div>
      <div class="player" id="player-turtle">
        <span class="icon">🐢</span>
        <span class="label">Turtle</span>
      </div>
    </div>
    
    <div class="status" id="status">Rabbit's turn</div>
    
    <div class="board" id="board">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>
      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>
      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>
    
    <button class="reset-btn" id="reset">New Game</button>
  </div>
  
  <script type="module" src="game.js"></script>
</body>
</html>
